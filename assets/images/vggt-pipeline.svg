<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 395" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Alur kerja VGGT dari gambar input ke atribut 3D</title>
  <desc id="d">N gambar input dipecah menjadi token oleh DINO, ditambah camera token dan register token, lalu diproses 24 lapis alternating-attention yang bergantian antara frame-wise dan global self-attention. Keluarannya masuk ke camera head yang menghasilkan parameter kamera dan DPT head yang menghasilkan depth map, point map, dan fitur untuk modul tracking.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="980" height="395" fill="#ffffff"/>

  <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M130,210 H158"/>
    <path d="M220,270 V252"/>
    <path d="M280,210 H318"/>
    <path d="M530,255 H558 V175 H532"/>
    <path d="M436,200 V228"/>
    <path d="M590,210 C620,210 620,120 650,120"/>
    <path d="M590,210 C620,210 620,290 650,290"/>
    <path d="M800,120 H838"/>
    <path d="M800,290 C820,290 820,237 838,237"/>
    <path d="M800,290 H838"/>
    <path d="M800,290 C820,290 820,355 838,355"/>
  </g>

  <g font-size="14" text-anchor="middle" fill="#111827">
    <rect x="20" y="170" width="110" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="75" y="205">Gambar input</text>
    <text x="75" y="225" font-size="12">(1 s.d. ratusan)</text>

    <rect x="160" y="170" width="120" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="220" y="205">Patchify</text>
    <text x="220" y="225" font-size="12">(DINO)</text>

    <rect x="160" y="272" width="120" height="58" rx="8" fill="#fef9c3" stroke="#a16207"/>
    <text x="220" y="296" font-size="12">+ camera token</text>
    <text x="220" y="314" font-size="12">+ 4 register token</text>

    <rect x="320" y="100" width="270" height="220" rx="12" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="455" y="128" font-weight="bold">Alternating-Attention</text>
    <text x="455" y="146" font-size="12">diulang 24 kali</text>
    <rect x="340" y="152" width="190" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="435" y="182">Frame-wise self-attention</text>
    <rect x="340" y="230" width="190" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="435" y="260">Global self-attention</text>

    <rect x="650" y="90" width="150" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="725" y="116">Camera head</text>
    <text x="725" y="135" font-size="12">(4 self-attn + linear)</text>

    <rect x="650" y="260" width="150" height="60" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="725" y="286">DPT head</text>
    <text x="725" y="305" font-size="12">(keluaran padat)</text>

    <rect x="840" y="98" width="130" height="44" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="905" y="116" font-size="13">Kamera g</text>
    <text x="905" y="133" font-size="11">[q, t, f] per frame</text>

    <rect x="840" y="215" width="130" height="44" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="905" y="242" font-size="13">Depth map D</text>

    <rect x="840" y="275" width="130" height="44" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="905" y="302" font-size="13">Point map P</text>

    <rect x="840" y="333" width="130" height="44" rx="8" fill="#fff7ed" stroke="#c2410c"/>
    <text x="905" y="351" font-size="12">Fitur T → modul</text>
    <text x="905" y="368" font-size="12">tracking</text>
  </g>

</svg>
