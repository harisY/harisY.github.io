<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" rel="home">
      <svg class="brand-mark" viewBox="0 0 17 17" aria-hidden="true" focusable="false">
        <rect x="0" y="0" width="5" height="5" rx="1"/><rect x="6" y="0" width="5" height="5" rx="1"/><rect x="12" y="0" width="5" height="5" rx="1"/>
        <rect x="0" y="6" width="5" height="5" rx="1"/><rect class="hot" x="6" y="6" width="5" height="5" rx="1"/><rect x="12" y="6" width="5" height="5" rx="1"/>
        <rect x="0" y="12" width="5" height="5" rx="1"/><rect x="6" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/>
      </svg>
      <span class="brand-name">{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="Navigasi utama">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>Tulisan</a>
      <a href="{{ '/arsip/' | relative_url }}"{% if page.url == '/arsip/' %} aria-current="page"{% endif %}>Arsip</a>
      <a href="{{ '/tentang/' | relative_url }}"{% if page.url == '/tentang/' %} aria-current="page"{% endif %}>Tentang</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Ganti tema" title="Ganti tema" hidden>
      <svg class="icon icon-auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <svg class="icon icon-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="icon icon-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>
