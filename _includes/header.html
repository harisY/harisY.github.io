<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" rel="home">
      <svg class="brand-mark" viewBox="0 0 17 17" aria-hidden="true" focusable="false">
        <rect x="0" y="0" width="5" height="5" rx="1"/><rect x="6" y="0" width="5" height="5" rx="1"/><rect x="12" y="0" width="5" height="5" rx="1"/>
        <rect x="0" y="6" width="5" height="5" rx="1"/><rect class="hot" x="6" y="6" width="5" height="5" rx="1"/><rect x="12" y="6" width="5" height="5" rx="1"/>
        <rect x="0" y="12" width="5" height="5" rx="1"/><rect x="6" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/>
      </svg>
      <span class="brand-name">{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="Navigasi utama">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>Tulisan</a>
      <a href="{{ '/tentang/' | relative_url }}"{% if page.url == '/tentang/' %} aria-current="page"{% endif %}>Tentang</a>
    </nav>
  </div>
</header>
