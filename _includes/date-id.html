{%- assign months = "Januari,Februari,Maret,April,Mei,Juni,Juli,Agustus,September,Oktober,November,Desember" | split: "," -%}
{%- assign month_index = include.date | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.date | date_to_xmlschema }}">{{ include.date | date: "%-d" }} {{ months[month_index] }} {{ include.date | date: "%Y" }}</time>
