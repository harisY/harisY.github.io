<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-about">
      <p class="footer-brand">{{ site.title | escape }}</p>
      <p class="footer-desc">{{ site.description | escape }}</p>
    </div>
    <nav class="footer-links" aria-label="Tautan footer">
      <a href="{{ '/' | relative_url }}">Tulisan</a>
      <a href="{{ '/arsip/' | relative_url }}">Arsip</a>
      <a href="{{ '/arsip/' | relative_url }}#cari">Cari</a>
      <a href="{{ '/tentang/' | relative_url }}">Tentang penulis</a>
      <a href="{{ '/feed.xml' | relative_url }}">Berlangganan (RSS)</a>
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      <a href="https://github.com/{{ site.github_username }}/{{ site.github_username }}.github.io">Repositori blog</a>
    </nav>
  </div>
  <div class="wrap footer-base">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author.name }}. Teks dilisensikan <a href="https://creativecommons.org/licenses/by/4.0/deed.id">CC BY 4.0</a>; gambar yang memuat sampel dataset mengikuti lisensi dataset asalnya.</p>
  </div>
</footer>
